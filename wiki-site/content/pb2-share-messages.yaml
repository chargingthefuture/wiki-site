# Ready-to-paste posts for Peace Battle 2 participants.
#
# The message of the day on the admin side is written in the owner's voice and carries their
# argument. That is the wrong asset to hand a participant: somebody who supports the protest may
# not agree with every opinion in it, and a post they half-agree with is one they do not make. So
# these say what a thing is and nothing else. There is nothing here to disagree with.
#
# `pool` is the set that is offered, in the order written. Only those ids are built; the rest stay
# here, unoffered, nothing deleted. Three topics and no others for now (owner directive,
# 2026-10-03, a narrowed marketing plan): Peace Battle 2 itself, One Percent, and PeerProgramming's
# goal board. A reader handed twenty-eight parts in rotation is handed a catalog; three topics say
# one thing, and a reader who follows one finds the rest of the app on their own. Fourteen posts
# across the three, each a different angle, so a reader sees two weeks before a repeat: the protest
# runs for years. The word `invites` in the pool adds the published invite posts back in. Widen the topics
# only on the owner's say.
#
# Every post ends with the entry point, which is the Peace Battle 2 page and not the sign-up page
# (owner directive, 2026-10-03): a reader who arrives from one of these should land on the protest.
#
# Each stands on its own — a reader may never click the link — and ends with a labeled link line,
# because a bare address alone on a line is what Quora's editor turns into a preview card while a
# labeled one stays as written.
#
# Plain text only. Quora's composer shows every markdown marker literally, so there is no
# formatting here to lose. Paragraphs are separated by a blank line in `body`.
#
# `link` is where an entry's own labeled line points. Leave it out for a part of the app and the
# build points at its guide section, which reads with no account; a deep link into the app would
# send a stranger to a sign-in screen, which is the opposite of what a first post should do. An
# entry whose link is the entry point gets the one line, not two.
#
# Adding one: copy an entry, give it an id nothing else uses, and keep it opinion-free. The build
# refuses a duplicate id, an empty field, or a pool id with no entry.

pool: [peace-battle-2, peer-programming, one-percent, pb2-name, pp-one-card, op-figure, pb2-organized, pp-bad-day, op-road, pb2-winning, pp-it-helped, op-estonia, pb2-virtual, pp-no-chat]

messages:
  - id: peace-battle-2
    feature: Peace Battle 2
    title: A protest you take part in from a phone
    link: https://chargingthefuture.github.io/chargingthefuture/peace-battle-2
    body: |-
      Peace Battle 2 is a protest for Targeted Individuals, taken part in from a phone, because the people it is for are spread across the world and most of them cannot travel to stand anywhere.

      It is organized, not led. Nobody speaks for survivors. It has two steps, in order: put whatever is left of your day into one small task on somebody else's goal, and work out what a year of your own trade is worth to the community. The first is free. The page has the date, the steps, and the arithmetic.

  - id: one-percent
    feature: One Percent
    title: Half an hour on the figure your trade produces
    link: https://farahbrunache.com
    body: |-
      Naming your next customer is the easy part. One Percent is a half hour, in your browser, on what comes after that: the figure your trade produces, the first customer behind it, and coaching and recommendations, optional, for the road from destitution to an autonomous life with the targeting behind you.

      It is the paid tier of the TI Skills Economy and needs no account.

  - id: directory
    feature: Directory
    title: There is a list of survivors and what each of them can do
    body: |-
      Most survivor spaces are somewhere to talk. This one is a list of people and the skills they hold, so you can look up the skill instead of asking a room and hoping.

      Being on it and having an account are separate things. Most entries were built for people rather than by them, from what those people already said about themselves in public, and anyone can claim theirs or have it taken down.

  - id: foundation
    feature: Foundation
    title: Where you ask a survivor for help and reach them directly
    body: |-
      Providers list what they offer. You find one and start a conversation or a call, without a middleman deciding whether your request is worth passing on.

      The person on the other end is there because offering help is what they signed up to do.

  - id: lighthouse
    feature: LightHouse
    title: Housing listings from hosts who already understand
    body: |-
      Rooms and places to stay, listed by people inside the community. No explaining from the beginning why you need somewhere quiet or why a lease in your name is a problem.

      A listing says which currencies it accepts, and some accept ServiceCredits, the community's internal credits unit.

  - id: trust-transport
    feature: TrustTransport
    title: A ride from somebody the community screened
    body: |-
      Getting somewhere is not a small problem when being followed is the ordinary condition. Drivers here are screened by the community rather than by a company that has never heard of any of this.

      You see who is driving before you accept, and the trip has a record.

  - id: socket-relay
    feature: SocketRelay
    title: Ask for a thing you need and see who has one
    body: |-
      Not a skill, not a service — an object. Somebody posts what they need, somebody who has it answers, and the two arrange it between themselves.

      It closes when the thing actually changes hands, so the board shows what is still open rather than what was once mentioned.

  - id: skills-hunt
    feature: SkillsHunt
    title: You can add a survivor to the list without them doing anything
    body: |-
      If you know somebody who has said in public what they can do, you can nominate them. Their skills join the catalog, and the listing is theirs to claim or remove whenever they want.

      This is how most of the list was built. Nobody was asked to fill in a form first.

  - id: skill-up
    feature: SkillUp
    title: Learn a skill from another survivor and earn credits as you go
    body: |-
      Training runs in small groups with a trainer from inside the community. You earn credits at each milestone rather than at the end, so stopping halfway still leaves you with something.

      The trainer earns for teaching it. Both sides of that are survivors.

  - id: service-credits
    feature: ServiceCredits
    title: An economy that does not touch a bank
    body: |-
      Work done inside the community is settled in credits, which are an internal unit and not money. Nothing here is redeemable for cash and nothing asks for a card.

      It exists because the ordinary way of paying people is one more system that can be closed against you.

  - id: workforce
    feature: Workforce
    title: A map of what this community can actually do
    body: |-
      Every skill anybody has listed, sorted by sector, against what a working economy needs. You can see which trades are covered and which have almost nobody.

      It is the planning tool, not a scoreboard. It says where the gaps are.

  - id: skills-taxonomy
    feature: Skills Taxonomy
    title: One shared catalog of trades, so two people mean the same thing
    body: |-
      Sectors, job titles and the skills under them, kept as one list. When somebody says what they do, it lands in the same place as everybody else who does it.

      Without that, a directory becomes a pile of free text nobody can search.

  - id: gdp
    feature: GDP
    title: Value exchanged inside the community, counted as it happens
    body: |-
      A running index of what has actually been exchanged and settled here, in the spirit of a GDP figure. It is a relative index, not money and not a price.

      Interest is counted separately from achievement, because most posts on any board never close and a number that mixes the two says nothing.

  - id: what-works
    feature: WhatWorks
    title: A list of tools that other survivors say actually work
    body: |-
      Organized by the problem you have rather than by product category. No ads, no affiliate links, nobody paying to appear.

      Somebody lists a thing that helped and others say whether it helped them too.

  - id: knowledge
    feature: Knowledge Library
    title: You can lend your own writing so the answers stop coming from one person
    body: |-
      There is an assistant in the app that answers from a library of survivor writing. If it only ever holds one person's work, it only ever gives one person's answers.

      You can contribute your own public writing to it, and you can withdraw it later.

  - id: mood
    feature: Mood
    title: Track your own patterns without telling anybody
    body: |-
      Anonymous mood logging, so you can look back and see a shape you could not see day to day. Nobody is reading it and nothing is scored.

      Knowing when it gets worse is the part that makes it arguable to anyone else.

  - id: click-log
    feature: ClickLog
    title: Write down what happened, while it is still fresh
    body: |-
      Incident logging built for this, with location optional. One person's log looks like a bad week; a lot of logs together show a pattern that one person cannot demonstrate alone.

      Your notes stay yours. What leaves is counted, not quoted.

  - id: trust
    feature: Trust
    title: Credibility built from what you did, not from who vouched for you
    body: |-
      Signals come from real participation across the app — work completed, rides given, arrangements confirmed by both sides. Nothing is bought and nothing is granted by an admin.

      It exists so somebody new can be taken seriously without knowing anybody yet.

  - id: recurring-activity
    feature: Recurring Activity
    title: Acknowledge the help that has been going on for months
    body: |-
      One tap to record an ongoing arrangement with another member. No amounts, no invoices, nothing to total up.

      Both sides confirm it, which is what keeps it a record of something real.

  - id: mutual-time
    feature: Mutual Time
    title: Find a time everybody can make, across every timezone
    body: |-
      Share one link. People pick the times that work for them in their own timezone and the app works out the overlap.

      A community spread across the world spends a lot of effort on this otherwise.

  - id: peer-programming
    feature: PeerProgramming
    title: A goal board for the part of the day that is left
    body: |-
      Most of a Targeted Individual's day goes to the attacks and to what they force. What is left might be five percent, and five percent is not enough to reach a goal alone. Twenty members with five percent of a day each is a full working day.

      PeerProgramming opens on a goal board built for that. Post one personal goal with a finish line and break it into tasks small enough to do from a phone in under half an hour. Take any one card from anybody else's goal, do it, and post what you found. A bad day costs nothing: take a card when you have the half hour, and not when you do not. Alongside it there is an optional chat and calls.

  - id: pb2-name
    feature: Peace Battle 2
    title: Why a protest has a name
    link: https://chargingthefuture.github.io/chargingthefuture/peace-battle-2
    body: |-
      In 1903 W. E. B. Du Bois looked back at what the people who founded the colleges had done after the Civil War: 2,000 trained, who trained 50,000, who taught nine millions. He called it the most wonderful peace-battle of the 19th century. It was fought with teaching and with work, and it was won.

      Movements get names. This one had been going on without one, which made it hard to point at and easy to deny. So it has a name, and the name says which lineage it belongs to. Peace Battle 2 is the second one.

  - id: pb2-organized
    feature: Peace Battle 2
    title: Organized, not led
    link: https://chargingthefuture.github.io/chargingthefuture/peace-battle-2
    body: |-
      Peace Battle 2 is organized, not led. Survivors are a distributed group and nobody speaks for them. The person who called the date did it because somebody has to call a date.

      Nothing in it asks you to agree with anybody. It asks for whatever is left of your day, from a phone, on one small task toward another survivor's goal.

  - id: pb2-winning
    feature: Peace Battle 2
    title: What winning looks like
    link: https://chargingthefuture.github.io/chargingthefuture/peace-battle-2
    body: |-
      Peace Battle 2 is finished when a survivor can get 99% of what they need, housing, transportation, goods and services, from other survivors. Not 100%: a phone and a vehicle need supply chains no community this size can run. Nearly everything else can be grown, made, taught, driven, repaired or arranged by somebody already on the list.

      The nearer marker is 384 approved members working with each other at any given time. It is expected to take a generation. It will probably take two.

  - id: pb2-virtual
    feature: Peace Battle 2
    title: Why it is virtual
    link: https://chargingthefuture.github.io/chargingthefuture/peace-battle-2
    body: |-
      A protest is normally bodies in one place. Survivors have tried that and turned up alone, because a protest in a place assumes neighbors, money for travel, and a day that can be given up. Most people this is for have none of the three.

      Targeting is spread across every country, race, class and religion, so the answer is distributed too. Peace Battle 2 began on September 18, 2026, runs for years, and costs nothing but the minutes you give it.

  - id: pp-one-card
    feature: PeerProgramming
    title: One card, from a phone, in under half an hour
    link: https://chargingthefuture.github.io/chargingthefuture/article/wiki-site/show-up-with-your-percent
    body: |-
      On the PeerProgramming goal board, a card is one small task from somebody else's goal. Find three yards hiring near Dallas and add their numbers. Find three campers under six thousand dollars within two hundred miles of Tulsa. Ask one dealer whether they finance with no credit check.

      You pick any one card, do it, post what you found, and it moves to Done with your name on it. One card is plenty.

  - id: pp-bad-day
    feature: PeerProgramming
    title: A bad day costs nothing
    link: https://app.chargingthefuture.com/guide#peer-programming
    body: |-
      A goal is a chain of small steps, and the attacks land on the chain. A step gets missed, the order breaks, and it starts over.

      The PeerProgramming goal board breaks the chain into cards other people can carry. You take a card when you have the half hour, and you do not when you do not. Nobody is waiting on you, and the goal keeps moving.

  - id: pp-it-helped
    feature: PeerProgramming
    title: What counts
    link: https://chargingthefuture.github.io/chargingthefuture/article/wiki-site/show-up-with-your-percent
    body: |-
      When a goal's owner marks a card "It helped", it counts. It goes toward the day's 384, the count of members who delivered something to another member on one day, and toward the helper's Weavers of the Commons badge.

      A card kept without that mark, or sent back, does not count. The owner of the goal decides, because they are the one who knows whether it helped.

  - id: pp-no-chat
    feature: PeerProgramming
    title: No conversation on the board, on purpose
    link: https://app.chargingthefuture.com/guide#peer-programming
    body: |-
      Group chats for this have been tried three ways and none of them held. Who shows up depends on how hard the day was, so the chat is a different room every time, and it slides from doing into comparing notes about the attacks, which already have most of the day.

      The PeerProgramming goal board holds a goal, its cards, and their results, and nothing else can be written there. The weekly sessions and the call are still in PeerProgramming, and they are optional.

  - id: op-figure
    feature: One Percent
    title: The figure your trade produces
    link: https://farahbrunache.com
    body: |-
      Serve one percent of five million survivors and that is 50,000 people. Workforce runs the arithmetic from those 50,000 back to you, weighted to your own trade, and shows what a year of serving them would add to the Community Value Index. That figure is your 1%.

      One Percent is the half hour on what to do with it: the first customer behind the figure, and the step after that.

  - id: op-road
    feature: One Percent
    title: From destitution to an autonomous life
    link: https://farahbrunache.com
    body: |-
      Most Targeted Individuals were pushed out of employment, and on purpose. What is left is the trade itself: what you know how to do, which nobody took.

      One Percent starts from the trade. A half hour, in your browser, on the figure it produces, the first customer behind it, and coaching and recommendations, optional, for the road from destitution to an autonomous life with the targeting behind you.

  - id: op-estonia
    feature: One Percent
    title: The Estonia of Targeted Individuals
    link: https://farahbrunache.com
    body: |-
      Estonia: 1.3 million people, occupied by a power that outnumbered them by more than a hundred to one and surveilled them through an informant network that reached into every town. They kept their language, kept their identity, and took their country back.

      Each survivor who makes the road from destitution to an autonomous life is one more citizen of the Estonia of Targeted Individuals. One Percent is a half hour on your first step down it.

  - id: chyme
    feature: Chyme
    title: Live rooms where you can just listen
    body: |-
      Audio rooms you can join without speaking and without a camera. Listening counts as being there.

      Isolation is the point of what is being done to people. A room with voices in it is a direct answer to that.

  - id: ti-radio
    feature: TI Radio
    title: Anybody can take a slot and host a discussion
    body: |-
      A published schedule of live discussions. You take an empty ninety minutes, write what it is about, and host it.

      The slot is taken, not granted. Nobody reviews the topic first, and reading the schedule needs no account.

  - id: fireside
    feature: Fireside
    title: A conversation under every post that does not disappear
    body: |-
      Reading it needs no account at all. Writing takes a free one, and comments run oldest first — nothing gets pushed up or buried by a count.

      Comments on a platform die with the account they were posted under. These have an address that still works next year.

  - id: contributions
    feature: Contributions
    title: Ways to help that cost nothing
    body: |-
      A gift card, a comment left on a post, a star on the repository. Each one is recorded and earns thank-you credits.

      Somebody with no money to give is not out of ways to contribute.

  - id: commons
    feature: Commons
    title: The room you land in
    body: |-
      One shared channel for everybody, rather than a dozen half-empty ones. Announcements land here too, so there is one place to look.

  - id: beacon
    feature: Beacon
    title: Live broadcasts you can watch with just a link
    body: |-
      No account needed to watch. Sign in only if you want to say something in the chat while it runs.

  - id: bug-reporting
    feature: Bug Reporting
    title: Report a problem without writing it in public
    body: |-
      Reports go to a private queue rather than a public tracker. The raw text stays private and a person reads it.

      The member most likely to hit a broken screen is the one who has not finished signing up yet, so this works before you are approved.

  - id: unlock
    feature: Unlock
    title: One step decides whether somebody real is at the other end
    body: |-
      Everybody comes in the same way: you paste the address of your own public profile, and a person reviews it. Not an algorithm, and not a form that anybody can fill in a thousand times.

      It is slow on purpose. It is the reason the list is worth anything.
