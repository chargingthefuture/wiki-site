# Ready-to-paste posts for Peace Battle 2 participants.
#
# Three topics and no others (owner directive, 2026-10-03): Peace Battle 2 itself, One Percent, and
# PeerProgramming's goal board. The pool used to carry one post per part of the app plus every
# invite post, and a reader handed twenty-eight parts in rotation is handed a catalog. Three topics
# say one thing, and a reader who follows one of them finds the rest of the app on their own.
#
# The message of the day on the admin side is written in the owner's voice and carries their
# argument. That is the wrong asset to hand a participant: somebody who supports the protest may
# not agree with every opinion in it, and a post they half-agree with is one they do not make. So
# these say what a thing is and nothing else. There is nothing here to disagree with.
#
# Each stands on its own — a reader may never click the link — and ends with a labeled link line,
# because a bare address alone on a line is what Quora's editor turns into a preview card while a
# labeled one stays as written.
#
# Plain text only. Quora's composer shows every markdown marker literally, so there is no
# formatting here to lose. Paragraphs are separated by a blank line in `body`.
#
# `link` is where the labeled line points. Leave it out for a part of the app and the build points
# at its guide section, which reads with no account; a deep link into the app would send a stranger
# to a sign-in screen, which is the opposite of what a first post should do. The build also appends
# the blog's standing sign-up line after it, because the link alone leaves a reader with nowhere to
# go once they have read the page.
#
# Adding one: only with the owner's say, since the count is the strategy. Copy an entry, give it an
# id nothing else uses, and keep it opinion-free. The build refuses a duplicate id or an empty field.

messages:
  - id: peace-battle-2
    feature: Peace Battle 2
    title: A protest you take part in from a phone
    link: https://chargingthefuture.github.io/chargingthefuture/peace-battle-2
    body: |-
      Peace Battle 2 is a protest for Targeted Individuals, taken part in from a phone, because the people it is for are spread across the world and most of them cannot travel to stand anywhere.

      It is organized, not led. Nobody speaks for survivors. It has two steps, in order: put whatever is left of your day into one small task on somebody else's goal, and work out what a year of your own trade is worth to the community. The first is free. The page has the date, the steps, and the arithmetic.

  - id: one-percent
    feature: One Percent
    title: Half an hour on the figure your trade produces
    link: https://farahbrunache.com
    body: |-
      Naming your next customer is the easy part. One Percent is a half hour, in your browser, on what comes after that: the figure your trade produces, the first customer behind it, and coaching and recommendations, optional, for the road from destitution to an autonomous life with the targeting behind you.

      It is the paid tier of the TI Skills Economy and needs no account.

  - id: peer-programming
    feature: PeerProgramming
    title: A goal board for the part of the day that is left
    body: |-
      Most of a Targeted Individual's day goes to the attacks and to what they force. What is left might be five percent, and five percent is not enough to reach a goal alone. Twenty members with five percent of a day each is a full working day.

      PeerProgramming opens on a goal board built for that. Post one personal goal with a finish line and break it into tasks small enough to do from a phone in under half an hour. Take any one card from anybody else's goal, do it, and post what you found. A bad day costs nothing: take a card when you have the half hour, and not when you do not. Alongside it there is an optional chat and calls.
