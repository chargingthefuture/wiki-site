<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Skills Economy Blog</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Feed autodiscovery. A reader handed the site address finds the feed from
      this line, with nobody copying an XML address out of a page — which is the
      step that loses people. %BASE_URL% is replaced at build time, so it is
      right locally and under the /chargingthefuture/ path on Pages alike.
    -->
    <link rel="alternate" type="application/rss+xml" title="Skills Economy" href="%BASE_URL%feed.xml" />
    <!-- The recorded broadcasts: served by the app, so a replay is in it as soon as it is ready. -->
    <link rel="alternate" type="application/rss+xml" title="Skills Economy: recorded broadcasts" href="https://app.chargingthefuture.com/api/beacon/replays/feed" />
    <!--
      No web font is loaded from a third party here. Readers of this blog have
      reason not to want their IP address and User-Agent handed to another
      company on every page view, and a font stylesheet does exactly that.
      Fonts are self-hosted and bundled from src/main.tsx instead.
    -->
    <!-- Apply a remembered Light / Dark choice before the page paints (src/components/ThemeToggle.tsx). -->
    <script>
      try {
        var t = localStorage.getItem("ctf-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
