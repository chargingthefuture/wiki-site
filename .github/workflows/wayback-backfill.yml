name: Wayback backfill

# Manual re-submission of content files to the Wayback Machine.
#
# The snapshot job in deploy-wiki-gh-pages.yml only covers files changed by the
# push that triggered it. This is for filling gaps — pages that were never
# submitted, or submissions archive.org refused at the time.
#
# Two ways to say what to send. Give `paths` for specific files. Or leave it
# empty and give an `offset`, and the run takes that many files in from the
# sorted list of everything under content/ — which is how a whole-blog backfill
# is walked, one offset at a time.
#
# This run takes bigger, slower batches than a publish does: 45 seconds apart,
# front page skipped, and up to two 60-second retries when archive.org turns a
# request away. Being turned away shows up as a dropped connection far more
# often than as an explicit 429. A publish keeps the smaller, faster defaults.
#
# Batch size is an input because archive.org hands out a burst and then refuses
# almost everything. Measured on a 40-file run through unarchived files: twelve
# saved, and the successes came every three to five minutes at the start, then
# stretched out and stopped entirely for the last half hour. The tail of a long
# run is spent being refused, so prefer a smaller `count` more often over a big
# batch that empties the allowance and then grinds.
#
# The two retries are load-bearing — do not remove them to save time. In that
# same run only four of the twelve saves landed on the first attempt; three came
# after the first retry and five after the second.

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Specific space-separated content paths. Leave empty to use offset."
        required: false
        type: string
      offset:
        description: "Skip this many files from the sorted list of all content, then take `count`."
        required: false
        default: "0"
        type: string
      count:
        description: "How many files to take. Smaller batches land more of them — see the note above."
        required: false
        default: "15"
        type: string

jobs:
  backfill:
    name: Submit pages to the Wayback Machine
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the skip check compares archive.org's newest snapshot
          # against each file's last commit time. A shallow clone stamps every
          # file with the head commit, so nothing would ever be skipped.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: wiki-site/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: wiki-site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: wiki-site
        run: pnpm install --frozen-lockfile

      - name: Submit to web.archive.org
        working-directory: wiki-site
        env:
          INPUT_PATHS: ${{ inputs.paths }}
          OFFSET: ${{ inputs.offset }}
          COUNT: ${{ inputs.count }}
          WAYBACK_MAX_FILES: ${{ inputs.count }}
          WAYBACK_SPACING_MS: "45000"
          WAYBACK_RETRY_WAIT_MS: "60000"
          WAYBACK_MAX_RETRIES: "2"
          # Save Page Now credentials from an archive.org account. When both are
          # present the script uses the documented authenticated API; without them
          # it falls back to the anonymous endpoint, which is throttled opaquely.
          WAYBACK_S3_ACCESS_KEY: ${{ secrets.WAYBACK_S3_ACCESS_KEY }}
          WAYBACK_S3_SECRET_KEY: ${{ secrets.WAYBACK_S3_SECRET_KEY }}
          WAYBACK_SKIP_HOME: "1"
          # Skip files archive.org already holds in a version newer than their
          # last commit. Repeated passes and the Quora-promotion backfill then
          # spend the rate limit only on what is actually missing.
          WAYBACK_SKIP_ARCHIVED: "1"
        run: |
          if [ -n "$INPUT_PATHS" ]; then
            SELECTED="$INPUT_PATHS"
          else
            TOTAL=$(find content -name '*.md' -not -iname 'readme.md' | wc -l)
            echo "Total content files: $TOTAL. Taking $COUNT from offset $OFFSET."
            SELECTED=$(find content -name '*.md' -not -iname 'readme.md' \
              | sed 's|^|wiki-site/|' | LC_ALL=C sort \
              | tail -n +$((OFFSET + 1)) | head -"$COUNT" | tr '\n' ' ')
          fi
          if [ -z "$SELECTED" ]; then
            echo "Nothing selected — offset is past the end of the list."
            exit 0
          fi
          # shellcheck disable=SC2086
          pnpm --filter @workspace/scripts exec tsx ./src/wayback-snapshot.ts $SELECTED
