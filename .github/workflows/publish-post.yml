name: Publish a post

# Publishes a post pull request without a chat session (owner request, 2026-11-24). Add the label
# "publish" to the pull request in the GitHub app; that label is the decision to publish. This
# workflow then does what /s did by hand, and merges:
#
#   merge main into the branch, take main's generated files and paste sheet, date the post today
#   (Eastern), sync the registry, put the post's paste sheet entry back with its new feed number,
#   regenerate the full and text-to-speech sheets, run every check and the build, push, merge,
#   and start the Pages deploy.
#
# Several labeled pull requests form a queue, taken oldest first, one at a time, so each one gets
# the next feed number after the one before it. A pull request merged by hand starts the queue
# again. It can also be run from Actions → Publish a post → Run workflow, with a pull request
# number, which labels that pull request and runs the queue.
#
# A pull request it cannot publish gets a comment saying why and loses the label, so it is not
# retried on every push: more than one post on the branch, no post on it, a conflict outside the
# generated files, or a failed check. If the repository's settings stop this workflow from merging,
# the pull request is left synced with a comment, ready for the merge button.
#
# Pushes and merges made with this workflow's token start no other workflow, so Validate & Build
# does not run on them; every check it runs is run here before the push. The deploy is started
# explicitly for that reason.

on:
  pull_request:
    types: [labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to publish. Empty runs the queue of pull requests labeled publish."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

# One run at a time: two runs would give two posts the same feed number.
concurrency:
  group: publish-post
  cancel-in-progress: false

jobs:
  publish:
    name: Publish labeled posts
    if: github.event_name != 'pull_request' || github.event.label.name == 'publish'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki-site
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: publish

    steps:
      # Full history: the sync orders same-day posts by each file's first commit.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: wiki-site/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: wiki-site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Label the pull request given by hand
        if: github.event_name == 'workflow_dispatch' && inputs.pr != ''
        env:
          PR: ${{ inputs.pr }}
        run: |
          gh label create "$LABEL" --color 0e8a16 --description "Publish this post: sync it with main and merge it" 2>/dev/null || true
          gh pr edit "$PR" --add-label "$LABEL"

      - name: Publish the queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The settle script is read from main, so a branch older than it can still be published.
          cp scripts/settle-post-pr.sh "$RUNNER_TEMP/settle-post-pr.sh"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          footer=$'\n\n---\n_Generated by the Publish a post workflow._'
          merged=0

          give_up() { # pr, reason
            gh pr comment "$1" --body "Not published: $2 The label \"$LABEL\" was removed; add it again once this is fixed. Run: $run_url$footer"
            gh pr edit "$1" --remove-label "$LABEL"
            echo "- #$1 not published: $2" >> "$GITHUB_STEP_SUMMARY"
          }

          echo "## Publish a post" >> "$GITHUB_STEP_SUMMARY"
          queue="$(gh pr list --label "$LABEL" --state open --json number,isCrossRepository,isDraft \
            --jq '[.[] | select(.isCrossRepository | not) | select(.isDraft | not) | .number] | sort | .[]')"
          if [ -z "$queue" ]; then
            echo "No open pull request is labeled $LABEL." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for pr in $queue; do
            echo "::group::#$pr"
            branch="$(gh pr view "$pr" --json headRefName --jq .headRefName)"
            git fetch -q origin main "$branch"
            git reset -q --hard
            git checkout -q -B "$branch" "origin/$branch"
            git clean -qfd -- .
            set +e
            bash "$RUNNER_TEMP/settle-post-pr.sh" > "$RUNNER_TEMP/settle.log" 2>&1
            code=$?
            set -e
            tail -40 "$RUNNER_TEMP/settle.log"
            echo "::endgroup::"
            reason="$(grep -E '^(More than one post|No new post|Conflicts with main)' "$RUNNER_TEMP/settle.log" | head -1)"
            if [ "$code" -ne 0 ]; then
              git merge --abort 2>/dev/null || true
              give_up "$pr" "${reason:-a check or the build failed (exit $code); the run log names the step.}"
              continue
            fi

            git push -q origin "HEAD:$branch"
            sha="$(git rev-parse HEAD)"
            post="$(git diff --name-only --diff-filter=A origin/main HEAD -- content | grep '\.md$' | head -1)"
            number="$(git diff origin/main HEAD -- QUORA_PASTE_SHEET.txt | grep -o '^+No\. [0-9]*' | cut -c2- | head -1)"

            # GitHub works out whether the pushed branch can merge a few seconds after the push.
            ok=0
            for attempt in 1 2 3 4 5 6; do
              sleep 10
              if gh pr merge "$pr" --merge --delete-branch --match-head-commit "$sha" 2>"$RUNNER_TEMP/merge.err"; then ok=1; break; fi
            done
            if [ "$ok" -eq 1 ]; then
              merged=$((merged + 1))
              echo "- #$pr merged: ${post#wiki-site/}, $number." >> "$GITHUB_STEP_SUMMARY"
            else
              gh pr comment "$pr" --body "Synced with main and dated today ($number), but this workflow could not merge it: $(tail -1 "$RUNNER_TEMP/merge.err") It is ready for the merge button. Run: $run_url$footer"
              echo "- #$pr synced, not merged: $(tail -1 "$RUNNER_TEMP/merge.err")" >> "$GITHUB_STEP_SUMMARY"
              # The rest of the queue would take this one's feed number. Merging it by hand starts
              # the queue again.
              break
            fi
          done

          if [ "$merged" -gt 0 ]; then
            gh workflow run deploy-wiki-gh-pages.yml --ref main
            echo "Deploy started." >> "$GITHUB_STEP_SUMMARY"
          fi
