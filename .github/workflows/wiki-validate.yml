name: Wiki — Validate & Build

on:
  push:
    # Validation means CI checks only: content validation, sync check, typecheck, and build.
    # It does not publish the site.
    branches: [main]
    paths:
      - "wiki-site/**"
      # A recording uploaded to the top of the repository by mistake is still published
      # (wiki-site/scripts/src/audio-files.ts finds it), so it has to start a build too.
      - "*.mp3"
      - "*.m4a"
      - ".github/workflows/wiki-validate.yml"
  pull_request:
    paths:
      - "wiki-site/**"
      # A recording uploaded to the top of the repository by mistake is still published
      # (wiki-site/scripts/src/audio-files.ts finds it), so it has to start a build too.
      - "*.mp3"
      - "*.m4a"
      - ".github/workflows/wiki-validate.yml"

jobs:
  validate-and-build:
    name: Validate content + build wiki
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki-site

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: wiki-site/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: wiki-site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Checks the blog's own writing for British spellings. content/archive/ is exempt:
      # those files are verbatim captures of what other people posted, and respelling someone
      # else's words falsifies the record.
      - name: Check US spelling
        run: node scripts/check-us-spelling.mjs

      # Checks the blog's own writing for the two banned words in CLAUDE.md's Excluded
      # Vocabulary. content/archive/ and the frozen manifesto are skipped, and a verbatim quote
      # of somebody else is wrapped in banned-words:disable / banned-words:enable.
      - name: Check banned words
        run: pnpm --filter @workspace/scripts run check-banned-words

      - name: Validate content front matter
        run: pnpm --filter @workspace/scripts run validate

      # The registry is regenerated here rather than gated on being committed,
      # so a post committed straight from the GitHub mobile app or web editor
      # (no local pnpm available) still validates and builds.
      - name: Sync articles (in-place)
        run: pnpm --filter @workspace/scripts run sync-articles

      # The teaser readings speak these numbers aloud, so a drifted one is a recording that sends
      # listeners to the wrong post. The numbers come from content/feed-numbers.json.
      - name: Paste sheet numbers match /feed
        run: pnpm --filter @workspace/scripts run check-paste-sheet-numbers

      - name: Typecheck wiki
        run: pnpm --filter @workspace/wiki run typecheck

      # The counter's tsconfig has project references to lib/api-zod and
      # lib/db, and tsc reads their built declarations rather than their
      # sources. Without this the typecheck below fails with TS6305 on a clean
      # checkout, where no dist/ exists yet.
      - name: Build shared library types
        run: pnpm run typecheck:libs

      # The counter service lives in this repo but deploys separately, so
      # nothing else here would catch a break in it before it reached Railway.
      - name: Typecheck counter service
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Build counter service
        run: pnpm --filter @workspace/api-server run build

      - name: Build wiki
        env:
          BASE_PATH: /
          PORT: 5000
        run: pnpm --filter @workspace/wiki run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-dist
          path: wiki-site/artifacts/wiki/dist/public
          retention-days: 7
